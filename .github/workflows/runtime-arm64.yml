name: Build and publish APB ARM64 runtime

on:
  # Publishing on every feature-branch push created many competing "latest"
  # releases. Publish only explicit version tags or a deliberate manual run.
  push:
    tags:
      - "runtime-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install rootfs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xz-utils curl unzip ca-certificates
      - name: Create Debian ARM64 root filesystem
        shell: bash
        run: |
          set -euxo pipefail
          sudo debootstrap --arch=arm64 --variant=minbase trixie rootfs http://deb.debian.org/debian
          sudo chroot rootfs apt-get update
          sudo chroot rootfs env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bash ca-certificates coreutils curl unzip zip xz-utils procps \
            aapt aidl zipalign android-sdk-platform-tools
          sudo mkdir -p rootfs/opt/android-sdk/platforms rootfs/opt/android-sdk/build-tools/35.0.0
          curl -fL https://dl.google.com/android/repository/platform-35_r02.zip -o platform-35.zip
          unzip -q platform-35.zip -d platform-unpack
          sudo mv platform-unpack/android-35 rootfs/opt/android-sdk/platforms/android-35
          for tool in aapt aapt2 aidl zipalign; do
            sudo ln -sf /usr/bin/$tool rootfs/opt/android-sdk/build-tools/35.0.0/$tool
          done
          printf 'Pkg.Revision=35.0.0\n' | sudo tee rootfs/opt/android-sdk/build-tools/35.0.0/source.properties
          sudo chroot rootfs apt-get clean
          sudo rm -rf rootfs/var/lib/apt/lists/* platform-unpack platform-35.zip
      - name: Install pinned JDK, Gradle and APKTool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package/jdk package/rootfs
          curl -fL 'https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_aarch64_linux_hotspot_17.0.21_9.tar.gz' -o jdk.tar.gz
          echo '3e4eca7ead088f080af1476007decf010a240a1eb4e1e78c54fa32fbcc347084  jdk.tar.gz' | sha256sum -c -
          tar -xzf jdk.tar.gz -C package/jdk --strip-components=1
          curl -fL https://services.gradle.org/distributions/gradle-8.14.4-bin.zip -o gradle.zip
          echo 'f1771298a70f6db5a29daf62378c4e18a17fc33c9ba6b14362e0cdf40610380d  gradle.zip' | sha256sum -c -
          unzip -q gradle.zip -d package
          mv package/gradle-8.14.4 package/gradle
          curl -fL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o package/apktool.jar
          echo '56d59c524fc764263ba8d345754d8daf55b1887818b15cd3b594f555d249e2db  package/apktool.jar' | sha256sum -c -
          sudo cp -a rootfs/. package/rootfs/
          sudo chown -R "$USER":"$USER" package
          mkdir -p package/rootfs/usr/local/share/apb
          printf 'APB runtime build: %s\n' "$GITHUB_SHA" > package/rootfs/usr/local/share/apb/build-info.txt
      - name: Audit runtime filesystem before packaging
        shell: bash
        run: |
          set -euo pipefail
          # PRoot supplies these virtual filesystems at launch. Never ship live
          # sockets, FIFOs or host pseudo-filesystem contents inside the archive.
          for dir in dev proc sys run; do
            sudo mkdir -p "package/rootfs/$dir"
            sudo find "package/rootfs/$dir" -mindepth 1 -delete
          done
          special="$(sudo find package -type p -o -type s)"
          if [ -n "$special" ]; then
            echo "Runtime contains unsupported FIFO/socket entries:"
            printf '%s\\n' "$special"
            exit 1
          fi
          sudo chown -R "$USER":"$USER" package
          test -x package/jdk/bin/java
          test -x package/gradle/bin/gradle
          test -f package/apktool.jar
          test -x package/rootfs/usr/bin/env
      - name: Package, validate and checksum runtime
        shell: bash
        env:
          XZ_OPT: "-T1 -6"
        run: |
          set -euo pipefail
          rm -f apb-runtime-arm64.tar.xz apb-runtime-arm64.tar.xz.sha256
          # Direct file output: no tar | xz pipeline, so there is no downstream
          # pipe closure that can truncate the archive or mask the failing step.
          tar --format=posix --hard-dereference --numeric-owner --owner=0 --group=0 \\
            -cJf apb-runtime-arm64.tar.xz -C package rootfs jdk gradle apktool.jar
          test -s apb-runtime-arm64.tar.xz
          xz -t apb-runtime-arm64.tar.xz
          tar -tJf apb-runtime-arm64.tar.xz >/dev/null
          mkdir -p archive-validation
          tar -xJf apb-runtime-arm64.tar.xz -C archive-validation
          test -x archive-validation/rootfs/usr/bin/env
          test -x archive-validation/jdk/bin/java
          test -x archive-validation/gradle/bin/gradle
          test -f archive-validation/apktool.jar
          if find archive-validation -type p -o -type s | grep -q .; then
            echo "Validated archive unexpectedly contains a FIFO or socket."
            exit 1
          fi
          sha256sum apb-runtime-arm64.tar.xz > apb-runtime-arm64.tar.xz.sha256
          sha256sum -c apb-runtime-arm64.tar.xz.sha256
          rm -rf archive-validation
      - name: Publish runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('runtime-v{0}', github.run_number) }}
          name: APB ARM64 Runtime ${{ github.ref_name }}
          files: |
            apb-runtime-arm64.tar.xz
            apb-runtime-arm64.tar.xz.sha256
          generate_release_notes: true
