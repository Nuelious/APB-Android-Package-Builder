name: APB Android CI
on:
 push:
  branches: [main]
 pull_request:
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - uses: android-actions/setup-android@v3\n     with:\n      accept-android-sdk-licenses: true\n      packages: |\n       platform-tools\n       platforms;android-35\n       build-tools;35.0.0
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.9"
   - name: Validate JSON files
     run: |
      python3 - <<'PY'
      import json
      from pathlib import Path
      for p in list(Path("schemas").glob("*.json"))+list(Path("templates").glob("*.json"))+list(Path("runtime").glob("*.json")):
          json.loads(p.read_text())
      print("JSON files are valid")
      PY
   - name: Run unit tests
     run: gradle --no-daemon testDebugUnitTest
   - name: Assemble debug APK
     run: gradle --no-daemon assembleDebug
   - uses: actions/upload-artifact@v4
     with:
      name: APB-debug
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error